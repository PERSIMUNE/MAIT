[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mait-toolbox"
version = "0.1.0a1"
description = "Medical Artificial Intelligence Toolbox: experimental packaging of the existing MAIT pipeline"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "PACKAGING.md"
authors = [{name = "MAIT contributors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/PERSIMUNE/MAIT"

[project.scripts]
mait = "mait.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mait = ["data/*.txt", "data/*.csv"]
